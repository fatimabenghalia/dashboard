<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nova — E-Commerce Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <a class="skip-link" href="#pageContent">Skip to content</a>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="brand-mark">
          <svg width="30" height="30" viewBox="0 0 32 32" fill="none" aria-hidden="true">
            <rect width="32" height="32" rx="10" fill="#315efb"/>
            <circle cx="16" cy="16" r="6" stroke="#fff" stroke-width="2"/>
          </svg>
        </div>
        <div>
          <span class="brand-name">Nova</span>
          <span class="brand-tag">Store Admin</span>
        </div>
      </div>

      <nav class="sidebar-nav" id="sidebarNav" aria-label="Main navigation">
        <p class="nav-group">Store</p>
        <a href="#dashboard" class="nav-link active" data-page="dashboard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
          Dashboard
        </a>
        <a href="#products" class="nav-link" data-page="products">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
          Products
        </a>
        <a href="#orders" class="nav-link" data-page="orders">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
          Orders
        </a>
        <a href="#customers" class="nav-link" data-page="customers">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          Customers
        </a>
        <a href="#analytics" class="nav-link" data-page="analytics">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M3 3v18h18"/><path d="M7 16l4-6 4 3 5-8"/></svg>
          Analytics
        </a>
        <a href="#reviews" class="nav-link" data-page="reviews">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          Reviews
        </a>
        <a href="#social" class="nav-link" data-page="social">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
          Social Media
        </a>
      </nav>

      <div class="sidebar-social">
        <p class="nav-group">Follow Us</p>
        <div class="social-links">
          <a href="#social" class="social-btn" data-page="social" aria-label="Instagram" title="Instagram">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
          </a>
          <a href="#social" class="social-btn" data-page="social" aria-label="Facebook" title="Facebook">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>
          </a>
          <a href="#social" class="social-btn" data-page="social" aria-label="TikTok" title="TikTok">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M9 12a4 4 0 1 0 4 4V4a5 5 0 0 0 5 5"/></svg>
          </a>
        </div>
      </div>

      <div class="sidebar-upgrade">
        <div class="upgrade-card">
          <p class="upgrade-title">Store Growth</p>
          <p class="upgrade-text">Boost sales with premium marketing tools.</p>
          <button type="button" class="btn-upgrade">Explore Plans</button>
        </div>
      </div>

      <div class="sidebar-bottom">
        <button type="button" class="sidebar-settings" aria-label="Settings" title="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.25"/><path d="M19.4 13.5c.1-.5.1-1 0-1.5l2-1.6-2-3.4-2.4.8c-.4-.3-.8-.6-1.3-.9l-.4-2.5H8.7l-.4 2.5c-.5.3-.9.6-1.3.9l-2.4-.8-2 3.4 2 1.6c-.1.5-.1 1 0 1.5l-2 1.6 2 3.4 2.4-.8c.4.3.8.6 1.3.9l.4 2.5h5.6l.4-2.5c.5-.3.9-.6 1.3-.9l2.4.8 2-3.4-2-1.6Z"/></svg>
        </button>

        
      </div>
    </aside>

    <div class="sidebar-overlay" id="sidebarOverlay" aria-hidden="true"></div>

    <div class="main">
      <header class="header">
        <button type="button" class="menu-toggle" id="menuToggle" aria-label="Toggle sidebar" aria-controls="sidebar" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>

        <div class="header-titles">
          <h1 class="page-title" id="pageTitle">Dashboard</h1>
          <p class="page-subtitle" id="pageSubtitle">Your store overview at a glance.</p>
        </div>

        <div class="header-actions">
          <div class="search-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="search" placeholder="Search this page…" aria-label="Search this page" id="globalSearch" autocomplete="off" />
          </div>
          <button type="button" class="icon-btn" id="notificationsButton" aria-label="Notifications" aria-haspopup="true" aria-expanded="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            <span class="notif-dot"></span>
          </button>
          <button type="button" class="profile-btn" id="profileButton" aria-label="Open profile menu" aria-haspopup="true" aria-expanded="false">
            <div class="profile-avatar">FL</div>
            <div class="profile-copy">
              <span class="profile-name">Fatima </span>
              <span class="profile-role">Store Manager</span>
            </div>
          </button>
          <button type="button" class="btn-primary" id="headerAction">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            <span>Export Report</span>
          </button>
        </div>
      </header>

      <main class="content" id="pageContent" tabindex="-1"></main>

      <nav class="mobile-footer" id="mobileFooter" aria-label="Mobile navigation">
        <a href="#dashboard" class="mob-nav active" data-page="dashboard" aria-label="Dashboard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
          <span>Home</span>
        </a>
        <a href="#products" class="mob-nav" data-page="products" aria-label="Products">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/></svg>
          <span>Shop</span>
        </a>
        <a href="#orders" class="mob-nav" data-page="orders" aria-label="Orders">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="1" y="3" width="15" height="13"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
          <span>Orders</span>
        </a>
        <a href="#social" class="mob-nav" data-page="social" aria-label="Social">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/></svg>
          <span>Social</span>
        </a>
        <button type="button" class="mob-nav" id="mobMenuBtn" aria-label="Open more navigation" aria-controls="sidebar" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          <span>More</span>
        </button>
      </nav>
    </div>
  </div>

  <div id="toastRegion" class="toast-region" role="status" aria-live="polite"></div>
  <script src="js/app.js"></script>
</body>
</html>
